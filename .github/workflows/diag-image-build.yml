# Temporary, for PR-0 (Slice 2 step 0b): finds why the first build of the fake provider's image fails on a
# fresh runner. Removed before the pull request merges.
name: Diagnose image build

on:
  pull_request:

jobs:
  docker-28-cli:
    strategy:
      fail-fast: false
      matrix:
        case: [legacy-as-is, legacy-without-empty-copy, buildkit-as-is]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -q -pl fake-provider -DskipTests package
      - name: Docker
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker info | grep -iE 'storage driver|driver-type' || true
      - name: What the jar's layers hold
        run: |
          mkdir -p /tmp/x && cp fake-provider/target/fake-provider-*.jar /tmp/x/app.jar
          (cd /tmp/x && java -Djarmode=tools -jar app.jar extract --layers --launcher --destination extracted && find extracted -maxdepth 2 | sort)
      - name: Without the COPY of the empty layer
        if: matrix.case == 'legacy-without-empty-copy'
        run: sed -i '/snapshot-dependencies/d' fake-provider/Dockerfile && cat fake-provider/Dockerfile
      - name: Build twice
        run: |
          set +e
          if [ "${{ matrix.case }}" = buildkit-as-is ]; then export DOCKER_BUILDKIT=1; else export DOCKER_BUILDKIT=0; fi
          for i in 1 2; do
            docker build --no-cache=false -t "diag-$i" fake-provider > "build-$i.log" 2>&1
            echo "== build $i exit=$?"
            tail -12 "build-$i.log"
          done
