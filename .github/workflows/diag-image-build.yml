# Temporary, for PR-0 (Slice 2 step 0b): finds why the first build of the fake provider's image fails on a
# fresh runner. Removed before the pull request merges.
name: Diagnose image build

on:
  pull_request:

jobs:
  docker-28:
    strategy:
      fail-fast: false
      matrix:
        code: [main, branch]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.code == 'main' && 'main' || '' }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Docker, as the runner had in October (ubuntu-24.04 still ships 28.0.4 with overlay2)
        run: |
          . /etc/os-release && echo "runner $PRETTY_NAME"
          docker version --format 'server {{.Server.Version}}'
          docker info | grep -iE 'storage driver|driver-type' || true
      - name: AT-10, the nightly's first test, at CI size
        run: ./mvnw -B verify -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false -Dit.test=AT10ThroughputIT
      - name: Image build lines
        if: always()
        run: grep -h -E "eclipse-temurin|Transferred|failed to|tally-fake-provider-test" tally/target/failsafe-reports/*.txt 2>/dev/null | head -20 || true
