# Temporary, for PR-0 (Slice 2 step 0b): finds why the first build of the fake provider's image fails on a
# fresh runner. Removed before the pull request merges.
name: Diagnose image build

on:
  pull_request:

jobs:
  nightly-command:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Docker
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker info | grep -iE 'storage driver|driver-type' || true
      - name: The nightly's command, unchanged
        run: >
          ./mvnw -B verify
          -Dit.test='AT09KillOneInstanceIT,AT10ThroughputIT'
          -Dtally.at09.accounts=5000
          -Dtally.at10.renewals=10000
      - name: Image build lines
        if: always()
        run: grep -h -E "Transferred|failed to|tally-fake-provider-test" tally/target/failsafe-reports/*-output.txt tally/target/failsafe-reports/*.txt 2>/dev/null | head -40 || true
