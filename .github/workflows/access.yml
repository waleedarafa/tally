# Access's pipeline (ADR-008: one pipeline per deployable; Slice 2 PR-6). Access is the second deployable (ADR-001),
# in the same repository and Maven reactor as billing: this pipeline builds the reactor's access module only (-pl
# access), and billing's (ci.yml) builds fake-provider and tally only. Access depends on no other module, only on the
# contract files in contracts/access-facts/.
# When it runs:
#   - A change to access/, to its OpenAPI file, to the contract files, to the build (pom.xml, the Maven wrapper) or to
#     this file. A change to contracts/ starts both pipelines: billing's F7 and Access's consumer tests both read it.
#   - On a pull request, against its merge into the base; on a push to main, also one image tally-access:<commit>.
name: Access

on:
  push:
    branches: [main]
    paths: ['access/**', 'docs/api/access-openapi.yaml', 'contracts/**', 'pom.xml', 'mvnw', '.mvn/**',
            '.github/workflows/access.yml']
  pull_request:
    paths: ['access/**', 'docs/api/access-openapi.yaml', 'contracts/**', 'pom.xml', 'mvnw', '.mvn/**',
            '.github/workflows/access.yml']
  workflow_dispatch:

concurrency:
  group: access-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commit-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit tests, the contract tests (OpenAPI, the examples, consumer-access.json), F7's Access side, and the
      # consumer's tests against a real broker and PostgreSQL.
      - name: Access tests
        run: ./mvnw -B -pl access verify

      - name: Print failed tests
        if: failure()
        run: python3 .github/scripts/print-failed-tests.py

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: access-test-reports
          path: |
            access/target/surefire-reports/
            access/target/failsafe-reports/
          if-no-files-found: ignore

      - name: Image name
        if: github.event_name == 'push'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally-access:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: github.event_name == 'push'

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: access
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Summary
        if: github.event_name == 'push'
        run: echo "Access passed. Pushed \`${{ steps.image.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
