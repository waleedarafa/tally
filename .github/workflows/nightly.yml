# Slice 1, build step 9: the load and chaos acceptance tests at nightly size (brief section 8).
# AT-10 runs with 10,000 renewals instead of CI's 2,000; AT-9 keeps CI's 5,000 accounts
# (1,000,000 belongs to staging, which slice 1 does not have).
name: Nightly load

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: AT-9 and AT-10 at nightly size
        run: >
          ./mvnw -B verify
          -Dit.test='AT09KillOneInstanceIT,AT10ThroughputIT'
          -Dtally.at09.accounts=5000
          -Dtally.at10.renewals=10000

      - name: Keep test reports and instance logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-load
          path: |
            tally/target/failsafe-reports/
            tally/target/instances/
          if-no-files-found: ignore
