# Slice 1, build step 3: run verify on every push, then build one container image
# per commit, tagged with the commit ID.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit, integration (Testcontainers) and fitness-function tests.
      - name: Verify
        run: ./mvnw -B verify

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      # Reached only when verify passed, so every image comes from a green commit.
      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally:${GITHUB_SHA}"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          docker build --build-arg REVISION="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${image}" tally/

      - name: Push image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}"
          echo "Pushed \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
