# Slice 1, build step 3: run verify on every push, then build one container image
# per commit, tagged with the commit ID.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unit, integration (Testcontainers) and fitness-function tests.
      - name: Verify
        run: ./mvnw -B verify

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      # Reached only when verify passed, so every image comes from a green commit.
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit pushes straight to the registry. The plain `docker push` from the
      # classic image store failed on GHCR with "unknown blob" (CI run 1).
      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: tally
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Summary
        run: echo "Pushed \`${{ steps.image.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"
