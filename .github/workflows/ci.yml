# The deployment pipeline, in two stages, for every push.
#   1. Commit stage: unit, fitness-function and module integration tests (about 2 minutes), then
#      one container image per commit, tagged with the commit ID. Fast feedback on every change.
#   2. Acceptance stage: the brief's acceptance tests (AT-1 to AT-12) and the spikes' behaviour
#      tests, on the same commit. When they pass, the image gets a second tag, accepted-<commit>:
#      only accepted images are candidates for deployment.
# The split is two Maven profiles in tally/pom.xml; without a profile, ./mvnw verify runs both.
# Both stages also run on pull requests, against GitHub's merge of the branch into its base, so the
# merged result is tested before it is merged (ADR-038). Images are built and tagged for pushes
# only: a pull request's merge commit never reaches main under that ID, so its image could never
# be deployed.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commit-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Commit tests
        run: ./mvnw -B -P commit-stage verify

      - name: Keep test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: commit-stage-test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: ignore

      # Reached only when the commit tests passed, so every image comes from a green commit.
      - name: Image name
        if: github.event_name != 'pull_request'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tally:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit pushes straight to the registry. The plain `docker push` from the
      # classic image store failed on GHCR with "unknown blob" (CI run 1).
      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request'

      - name: Build and push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: tally
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.name }}
          build-args: REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Summary
        if: github.event_name != 'pull_request'
        run: echo "Commit stage passed. Pushed \`${{ steps.image.outputs.name }}\`" >> "$GITHUB_STEP_SUMMARY"

  acceptance-stage:
    needs: commit-stage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Acceptance tests
        run: ./mvnw -B -P acceptance-stage verify

      - name: Keep test reports and instance logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-stage-test-reports
          path: |
            **/target/failsafe-reports/
            tally/target/instances/
          if-no-files-found: ignore

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4
        if: github.event_name != 'pull_request'

      # A new tag on the same image, by manifest: nothing is rebuilt.
      - name: Mark the image accepted
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ needs.commit-stage.outputs.image }}
        run: |
          ACCEPTED="${IMAGE%:*}:accepted-${GITHUB_SHA}"
          docker buildx imagetools create --tag "$ACCEPTED" "$IMAGE"
          echo "Acceptance stage passed. Tagged \`$ACCEPTED\`" >> "$GITHUB_STEP_SUMMARY"
