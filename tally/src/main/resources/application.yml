spring:
  application:
    name: tally
  datasource:
    url: jdbc:postgresql://localhost:5432/tally
    username: tally
    password: tally
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    datatype:
      enum:
        # CLAUDE.md rule 7: a stored event read by an older version may hold an enum value it does not
        # know. Every enum that crosses a module boundary or is stored in an event has a constant marked
        # @JsonEnumDefaultValue (UNKNOWN, or UNRECOGNISED where UNKNOWN is a real state: ADR-024);
        # this maps unknown values to it instead of failing.
        # Spring Modulith serializes event publications with this JsonMapper.
        read-unknown-enum-values-using-default-value: true
  flyway:
    # One schema per data-owning module (CLAUDE.md, rule 2). Flyway's history table lives in "public".
    default-schema: public
management:
  endpoints:
    web:
      exposure:
        # Queue and job health (FR-023) is read from /actuator/metrics.
        include: health,metrics
