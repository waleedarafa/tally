spring:
  application:
    name: tally
  datasource:
    url: jdbc:postgresql://localhost:5432/tally
    username: tally
    password: tally
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    datatype:
      enum:
        # CLAUDE.md rule 7: a stored event read by an older version may hold an enum value it does not
        # know. Every enum that crosses a module boundary or is stored in an event has a constant marked
        # @JsonEnumDefaultValue (UNKNOWN, or UNRECOGNISED where UNKNOWN is a real state: ADR-024);
        # this maps unknown values to it instead of failing.
        # Spring Modulith serializes event publications with this JsonMapper.
        read-unknown-enum-values-using-default-value: true
  flyway:
    # One schema per data-owning module (CLAUDE.md, rule 2). Flyway's history table lives in "public".
    default-schema: public
  security:
    oauth2:
      resourceserver:
        jwt:
          # ADR-032 (Slice 4): Tally checks each token itself, with the identity provider's public keys. No
          # product is chosen yet (brief rule 11), so the issuer and its key set come from the environment; an
          # instance without them does not start. The audience is billing's.
          issuer-uri: ${TALLY_IDENTITY_ISSUER}
          jwk-set-uri: ${TALLY_IDENTITY_JWK_SET_URI}
          audiences: tally-billing
management:
  server:
    # The health and metrics endpoints on a port of their own, open to the platform that runs Tally; they hold
    # no household data (Slice 4, brief rule 10). The API is on server.port.
    port: 8082
  endpoints:
    web:
      exposure:
        # Queue and job health (FR-023) is read from /actuator/metrics, and scraped for the alert rules
        # (ops/alerts, ADR-030) from /actuator/prometheus.
        include: health,metrics,prometheus
