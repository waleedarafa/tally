spring:
  application:
    name: tally-access
  datasource:
    url: jdbc:postgresql://localhost:5433/access
    username: access
    password: access
  flyway:
    default-schema: access
    schemas: access
  security:
    oauth2:
      resourceserver:
        jwt:
          # Slice 4 (ADR-032; decision 1 of the brief): Access checks each token itself, with the identity provider's
          # public keys, kept in its database (ADR-039, option A). The issuer and its key set come from the
          # environment; an instance without them does not start. Tokens for Access or for billing pass the audience
          # check; only the streaming platform's service token for Access is answered (AccessSecurity).
          issuer-uri: ${TALLY_IDENTITY_ISSUER}
          jwk-set-uri: ${TALLY_IDENTITY_JWK_SET_URI}
          audiences: tally-access, tally-billing
server:
  port: 8090
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready only once the copy may answer (CopyReadyHealthIndicator); Spring Boot's own readiness state alone says yes as
        # soon as the application has started.
        readiness:
          include: readinessState,copyReady
tally:
  access:
    log:
      bootstrap-servers: localhost:9092
      topic: access-facts
      group-id: tally-access
