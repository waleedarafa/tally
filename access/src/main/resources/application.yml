spring:
  application:
    name: tally-access
  datasource:
    url: jdbc:postgresql://localhost:5433/access
    username: access
    password: access
  flyway:
    default-schema: access
    schemas: access
server:
  port: 8090
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Ready only once the copy may answer (CopyReadyHealthIndicator); Spring Boot's own readiness state alone says yes as
        # soon as the application has started.
        readiness:
          include: readinessState,copyReady
tally:
  access:
    log:
      bootstrap-servers: localhost:9092
      topic: access-facts
      group-id: tally-access
