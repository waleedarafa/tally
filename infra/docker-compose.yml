# Local PostgreSQL and the event log for running Tally outside tests: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports:
      - "5432:5432"
    volumes:
      - tally-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The event log (ADR-012; Slice 2 PR-5): one Kafka broker in KRaft mode, at the version of the client
  # (spike S-1). Tally's relay sends to topic access-facts (tally.accessfeed.log.*), created compacted by kafka-topics.
  kafka:
    image: apache/kafka:4.2.1
    ports:
      - "9092:9092"
    volumes:
      - tally-kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      timeout: 10s
      retries: 20
  kafka-topics:
    image: apache/kafka:4.2.1
    # In the broker's network namespace: the broker advertises localhost:9092.
    network_mode: "service:kafka"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists
      --topic access-facts --partitions 1 --replication-factor 1 --config cleanup.policy=compact
    restart: "no"
  # Access's own database (ADR-001, ADR-007: Access has its own small PostgreSQL), for the access module on port 8090.
  access-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: access
      POSTGRES_USER: access
      POSTGRES_PASSWORD: access
    ports:
      - "5433:5432"
    volumes:
      - access-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d access"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tally-pgdata:
  tally-kafkadata:
  access-pgdata:
