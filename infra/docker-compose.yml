# Local PostgreSQL for running Tally outside tests: docker compose -f infra/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tally
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports:
      - "5432:5432"
    volumes:
      - tally-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Access's own database (ADR-001, ADR-007: Access has its own small PostgreSQL), for the access module on port 8090.
  access-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: access
      POSTGRES_USER: access
      POSTGRES_PASSWORD: access
    ports:
      - "5433:5432"
    volumes:
      - access-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d access"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tally-pgdata:
  access-pgdata:
