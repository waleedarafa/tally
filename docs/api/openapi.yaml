openapi: 3.1.0
info:
  title: Tally REST API
  version: "1"
  description: >
    The REST contract, v1 (design.md §8; ADR-019). Written before the code (OpenAPI first) and checked against
    it: the contract tests validate every request and response below (com.tally.contract). Versions live in the
    path; changes are additive; a break is /v2. Every request that changes state requires an Idempotency-Key
    (CLAUDE.md rule 13), handled by the platform's shared mechanism. Every request carries a bearer token from the
    identity provider (ADR-032, Slice 4); Tally checks its signature, issuer, audience and expiry, and answers 401
    when any check fails. The token's subject is the user; a user has one account (WAR-84).
security:
  - bearer: []
paths:
  /v1/accounts:
    post:
      operationId: openAccount
      summary: Opens an account.
      description: >
        Opens the caller's account and links it to the user, the token's subject (ADR-032). A user has one account
        (WAR-84): if the user has one, the answer is 200 with it, whatever the key; of two requests at the same
        time, both answer with the one account. The body is checked first. The Idempotency-Key is claimed before
        acting; the response is stored in the same transaction as the new account, and both are kept for 24 hours.
        Keys belong to the caller (ADR-027): two users who send the same key value each get their own request's
        result.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenAccountRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "200":
          description: The user has an account already; this is it. Nothing was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "201":
          description: The account was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/RequestInProgress"
        "422":
          $ref: "#/components/responses/KeyReused"
  /v1/accounts/{id}:
    get:
      operationId: getAccount
      summary: Reads an account.
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: >
            No such account, or not the caller's: another household's account answers as one that does not
            exist (Slice 4). No body.
  /v1/me/account:
    get:
      operationId: getMyAccount
      summary: Reads the caller's account.
      description: >
        Slice 4. The account linked to the user, the token's subject: for an app on a new phone, and for the
        streaming platform, which keeps each user's account ID. Read only: no Idempotency-Key.
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "200":
          description: The caller's account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: The user has no account yet. No body.
  /v1/accounts/{accountId}/collections/payment-requests:
    post:
      operationId: payNow
      summary: Pay now. Asks again for the payment of every unpaid invoice of the account's Collections case.
      description: >
        Slice 3, decision 2. Works while a debt is open: in the case states OPEN, OVERDUE, BLOCKED and WRITTEN_OFF.
        Collections asks Invoicing to request the payment again for every unpaid invoice of the case, using the card
        the account already has. Every request of a case, scheduled or "pay now", takes the next retry number at the
        moment it is asked, so an early "pay now" changes nothing in the timetable. The outcome arrives later: the invoice is paid, or
        the payment is declined, which changes no state (the timetable decides). The Idempotency-Key is scoped by
        account until callers are authenticated; the request and its stored response commit together.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: accountId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "202":
          description: Collections asked again; the outcome arrives later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: >
            The account has no debt open, there is no such account, or it is not the caller's; each answers the
            same, and nothing is asked of the card (Slice 4).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          $ref: "#/components/responses/RequestInProgress"
        "422":
          $ref: "#/components/responses/KeyReused"
  /v1/payments/{reference}/status:
    get:
      operationId: getPaymentStatus
      summary: The latest payment attempt for a reference, read from Payment (FR-019).
      parameters:
        - name: reference
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "200":
          description: The latest attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          description: >
            No payment was requested for this reference, or its account is not the caller's (Slice 4). No body.
  /v1/subscriptions:
    post:
      operationId: signUp
      summary: Subscribes an account to a plan (sign-up).
      description: >
        Records the payment token the provider's hosted card form returned, then starts the subscription.
        Answers at once: the first invoice and its payment follow asynchronously, and access is granted
        within the promised seconds (ADR-014: 99% within 5 seconds; the app shows "activating").
        The Idempotency-Key is claimed before acting; the response is stored in the same transaction as the
        sign-up, and both are kept for 24 hours: a repeat with the same key and the same body returns the stored
        response, error responses included. Keys are scoped by account (the body's accountId) until callers are
        authenticated; then they will be scoped by caller.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "201":
          description: >
            The subscription started. A different Idempotency-Key starts another subscription
            of the same account (ADR-046). A retry of the same key returns the existing one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignUpResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: >
            No such account, or not the caller's; each answers the same, and nothing is recorded (Slice 4).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >
            `account-blocked`: the account's standing is BLOCKED.
            `request-in-progress`: a request with this Idempotency-Key is still being handled; see Retry-After.
            `concurrent-change`: the request met a change made at the same time (a lost lock or a deadlock);
            nothing was changed and the key was not used up; send the same request again, with the same key, after
            Retry-After.
          headers:
            Retry-After:
              description: >
                With request-in-progress, the seconds until the first request's timeout ends. With concurrent-change,
                the seconds to wait before the same request is sent again.
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >
            `offer-not-available`: the plan is not offered to this account.
            `idempotency-key-reused`: the key was used for a different request.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        A UUID the client makes for this request; any other value is refused with 400 and not stored. It belongs
        to the caller, the token's user (ADR-027; Slice 4): another user's request with the same value is a request
        of its own. Kept for 24 hours. A key still held by a request
        that has not answered within 60 seconds is taken over by the next request with it: that request died, and
        its change rolled back with its response.
      schema:
        type: string
        format: uuid
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A JWT signed by the identity provider (ADR-032). Its subject is the user; its audience is tally-billing.
  responses:
    Unauthenticated:
      description: >
        No token, or one that fails a check: the signature, the issuer, the audience or the expiry. Nothing was
        changed. No body.
      headers:
        WWW-Authenticate:
          description: The bearer challenge (RFC 6750), naming the error when a token was sent.
          schema:
            type: string
    BadRequest:
      description: The Idempotency-Key header is missing, or the body is not valid for this request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestInProgress:
      description: >
        `request-in-progress`: a request with this Idempotency-Key is still being handled.
        `concurrent-change`: the request met a change made at the same time; nothing was changed and the key was not
        used up; send the same request again, with the same key.
      headers:
        Retry-After:
          description: >
            With request-in-progress, the seconds until the first request's timeout ends. With concurrent-change, the
            seconds to wait before the same request is sent again.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    KeyReused:
      description: "`idempotency-key-reused`: the key was used for a different request."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OpenAccountRequest:
      type: object
      required: [currency, timeZone]
      properties:
        currency:
          type: string
          description: ISO 4217, for example AED.
        timeZone:
          type: string
          description: IANA time zone, for example Asia/Dubai.
    PaymentRequest:
      type: object
      additionalProperties: false
      required: [caseId, retry, invoiceIds]
      properties:
        caseId:
          type: string
          format: uuid
        retry:
          type: integer
          minimum: 1
          description: >
            The case's retry number for this request. Every request of a case, scheduled (day 3, day 7) or "pay now",
            takes the next number at the moment it is asked.
        invoiceIds:
          type: array
          description: The unpaid invoices Collections asked for.
          items:
            type: string
            format: uuid
    Account:
      type: object
      required: [id, currency, timeZone]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        currency:
          type: string
        timeZone:
          type: string
    PaymentStatus:
      type: object
      required: [reference, state, failureReason]
      additionalProperties: false
      properties:
        reference:
          type: string
        state:
          type: string
          description: >
            REQUESTED, SENT, SUCCEEDED, DECLINED, TECHNICAL_FAILURE or UNKNOWN. Extensible: clients must accept
            values not listed.
        failureReason:
          type: [string, "null"]
          description: For a decline, SOFT or HARD; null otherwise. Extensible.
    SignUpRequest:
      type: object
      required: [accountId, planId, paymentToken]
      properties:
        accountId:
          type: string
          format: uuid
        planId:
          type: string
          description: The offer to subscribe to, for example STANDARD.
        paymentToken:
          type: string
          description: The provider's token for the card (FR-015). Card numbers never reach Tally.
    SignUpResponse:
      type: object
      required: [subscriptionId, status, accessWithinSeconds]
      additionalProperties: false
      properties:
        subscriptionId:
          type: string
          format: uuid
        status:
          type: string
          description: >
            The subscription's state. Extensible (ADR-016, add-only): clients must accept values not listed;
            TRIAL and others will be added. Slice 1R returns ACTIVE.
          examples: [ACTIVE]
        accessWithinSeconds:
          type: integer
          description: How soon access is granted (ADR-014). Always 5 in v1.
          examples: [5]
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: >
            /problems/offer-not-available, /problems/already-subscribed, /problems/account-blocked,
            /problems/idempotency-key-reused, /problems/request-in-progress, /problems/concurrent-change (design.md §8),
            or about:blank for errors
            without a code of their own.
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
