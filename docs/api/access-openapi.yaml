openapi: 3.1.0
info:
  title: Tally Access API
  version: "1"
  description: >
    Access, the second deployable (ADR-001): "Can I watch?", answered from Access's own copy of the access facts,
    which it reads from the event log (ADR-012, ADR-033, ADR-035; design.md §8). Written before the code and checked
    against it (com.tallyaccess's contract test). Versions live in the path; changes are additive; a break is /v2.
    Read only: nothing here changes state, so no Idempotency-Key. Access answers only the streaming platform, which
    calls with a service token from the identity provider: audience tally-access, scope access:read (ADR-032; Slice 4,
    decision 1, option A). Access checks it itself, with the provider's keys kept in its own database (ADR-039).
security:
  - bearer: []
paths:
  /v1/access/{subscriberId}:
    get:
      operationId: getAccess
      summary: Whether the subscriber may watch.
      description: >
        In Slice 2 the subscriber is the account: the ID is the account ID (ADR-033). The answer comes from Access's
        own copy, also while billing is down (D13). A value Access does not know never takes access away: an unknown
        standing is not BLOCKED, and a source in an unknown state counts as active (ADR-033). An instance that has not
        yet caught up with the log answers 503 and no body (readiness, brief PR-6).
      parameters:
        - name: subscriberId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The answer, also for a subscriber Access does not know (reason NOT_KNOWN).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Access"
        "400":
          description: The ID is not a UUID. No body.
        "401":
          description: >
            No token, or one that fails a check: the signature, the issuer, the audience (tally-access or tally-billing)
            or the expiry. No body.
          headers:
            WWW-Authenticate:
              description: The bearer challenge (RFC 6750).
              schema:
                type: string
        "403":
          description: >
            A valid token that is not the streaming platform's service token for Access: a household's token, or one
            without the scope access:read. No body.
        "503":
          description: >
            This instance has not caught up with the log yet, or it cannot check the token now: the identity provider is
            down and no key set is kept (then with Retry-After). No body; another instance may answer.
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The streaming platform's service token (audience tally-access, scope access:read).
  schemas:
    Access:
      type: object
      additionalProperties: false
      required: [subscriberId, canWatch, reason, asOf, sequence]
      properties:
        subscriberId:
          type: string
          format: uuid
        canWatch:
          type: boolean
        reason:
          type: string
          enum: [ACTIVE_SOURCE, ACCOUNT_BLOCKED, NO_ACTIVE_SOURCE, NOT_KNOWN]
          description: Why. Later versions may add values; a client treats one it does not know as "ask again later".
        asOf:
          type: [string, "null"]
          format: date-time
          description: When the facts behind the answer were produced (their producedAt); null for NOT_KNOWN.
        sequence:
          type: [integer, "null"]
          minimum: 1
          description: The sequence of the facts behind the answer; null for NOT_KNOWN.
